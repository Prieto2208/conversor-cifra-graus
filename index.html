<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversor de cifra para graus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
  :root {
    --bg: #EEF1F5;
    --surface: #FFFFFF;
    --ink: #1E2433;
    --muted: #5B6478;
    --line: #D3D9E3;
    --accent: #3F51C7;
    --accent-ink: #FFFFFF;
    --chord: #B04A2F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #151923; --surface: #1E2330; --ink: #E6E9F0; --muted: #9AA3B5;
      --line: #313849; --accent: #8E9BFF; --accent-ink: #12162A; --chord: #F0956F;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #151923; --surface: #1E2330; --ink: #E6E9F0; --muted: #9AA3B5;
    --line: #313849; --accent: #8E9BFF; --accent-ink: #12162A; --chord: #F0956F;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin: 0 0 24px; max-width: 70ch; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  select {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 120px;
  }
  .check { display: flex; gap: 8px; align-items: center; font-size: 0.95rem; }
  .ref { margin-left: auto; font-size: 0.95rem; }
  .ref strong { color: var(--accent); }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 820px) { .panes { grid-template-columns: 1fr; } .ref { margin-left: 0; } }
  .pane { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .pane-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pane-head h2 { font-size: 1.05rem; margin: 0; }
  textarea, .output {
    font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 14px; line-height: 1.55;
    width: 100%; min-height: 460px; padding: 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    white-space: pre; overflow: auto; resize: vertical; tab-size: 4;
  }
  .output .ch { color: var(--chord); font-weight: 600; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 6px 12px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  button.ghost { background: transparent; color: var(--accent); }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .btns { display: flex; gap: 8px; }
  .status { font-size: 0.85rem; color: var(--muted); min-height: 1.3em; }

  /* Janela que pede o nome do arquivo Word */
  dialog {
    width: min(420px, calc(100% - 32px)); padding: 20px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog h2 { font-size: 1.1rem; margin: 0 0 12px; }
  dialog label { display: block; font-size: 0.85rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  dialog input[type="text"] {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  dialog .hint { font-size: 0.85rem; color: var(--muted); margin: 8px 0 16px; overflow-wrap: anywhere; }
  dialog .hint strong { color: var(--ink); }
  dialog .btns { justify-content: flex-end; }
</style>
</head>
<body>
<main>
  <h1>Conversor de cifra para graus</h1>
  <p class="lead">Cole a cifra à esquerda. As linhas de acordes são convertidas em graus e a letra fica como está, na mesma posição. Tudo acontece no seu navegador.</p>

  <section class="controls" aria-label="Configurações">
    <div class="field">
      <label for="root">Tom</label>
      <select id="root"></select>
    </div>
    <div class="field">
      <label for="mode">Modo</label>
      <select id="mode">
        <option value="major">Maior</option>
        <option value="minor">Menor</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="relative" checked> Tom menor pelo relativo maior</label>
    <div class="ref" id="ref" aria-live="polite"></div>
  </section>

  <div class="panes">
    <div class="pane">
      <div class="pane-head">
        <h2>Cifra original</h2>
        <button class="ghost" id="clear">Limpar</button>
      </div>
      <textarea id="input" spellcheck="false" aria-label="Cifra original"></textarea>
      <div class="status" id="status"></div>
    </div>
    <div class="pane">
      <div class="pane-head">
        <h2>Em graus</h2>
        <div class="btns">
          <button class="ghost" id="word">Baixar Word</button>
          <button id="copy">Copiar</button>
        </div>
      </div>
      <div class="output" id="output" tabindex="0" aria-label="Cifra em graus"></div>
    </div>
  </div>
</main>

<dialog id="nameDialog" aria-labelledby="nameTitle">
  <form id="nameForm">
    <h2 id="nameTitle">Baixar Word</h2>
    <label for="fileName">Nome da música</label>
    <input type="text" id="fileName" placeholder="Ex.: Ousado Amor" autocomplete="off" maxlength="100">
    <p class="hint">Será salvo como <strong id="filePreview">cifra-em-graus.docx</strong></p>
    <div class="btns">
      <button type="button" class="ghost" id="nameCancel">Cancelar</button>
      <button type="submit">Baixar</button>
    </div>
  </form>
</dialog>

<script>
// ---------- 1. Teoria: notas e graus ----------
const NOTE_VALUES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const ROOT_OPTIONS = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];

// Distância em semitons a partir da tônica -> nome do grau
const MAJOR_DEGREES = ["1", "b2", "2", "b3", "3", "4", "#4", "5", "b6", "6", "b7", "7"];
const MINOR_DEGREES = ["1", "b2", "2", "3", "#3", "4", "b5", "5", "6", "#6", "7", "#7"];

// Qualidade esperada de cada grau no campo harmônico (distância em semitons -> qualidade).
// Graus fora do campo não aparecem aqui: são sempre marcados (empréstimo modal).
const MAJOR_FIELD = { 0: "M", 2: "m", 4: "m", 5: "M", 7: "M", 9: "m", 11: "dim" };
const MINOR_FIELD = { 0: "m", 2: "dim", 3: "M", 5: "m", 7: "m", 8: "M", 10: "M" };
const QUALITY_MARK = { M: "M", m: "m", dim: "°", aug: "+" };

function noteToSemitone(letter, accidental) {
  let value = NOTE_VALUES[letter];
  if (accidental === "#") value += 1;
  if (accidental === "b") value -= 1;
  return (value + 12) % 12; // o "+ 12" evita número negativo (ex.: Cb)
}

// ---------- 2. Reconhecer um acorde ----------
// Nota + acidente + sufixo + baixo opcional. O sufixo só aceita símbolos de acorde,
// assim palavras como "Eu" ou "Do" não são confundidas com acordes.
const CHORD_RE = /^([A-G])([#b]?)((?:maj|min|dim|aug|sus|add|m|M|°|º|\+|-|[0-9]|\(|\)|#|b|,)*)(?:\/([A-G])([#b]?))?$/;

function parseChord(token) {
  const match = token.match(CHORD_RE);
  if (!match) return null;
  const [, letter, acc, suffix, bassLetter, bassAcc] = match;
  return {
    root: noteToSemitone(letter, acc),
    suffix,
    bass: bassLetter ? noteToSemitone(bassLetter, bassAcc) : null,
  };
}

// ---------- 3. Converter um acorde em grau ----------
// Qualidade básica do acorde, ignorando extensões (7, 9, 11...).
// null = não define qualidade (sus, power chord "5"): nunca é marcado.
function chordQuality(suffix) {
  if (/^sus/.test(suffix) || suffix === "5") return null;
  if (/dim|°|º/.test(suffix)) return "dim";
  if (/^(m(?!aj)|min|-)/.test(suffix)) return /b5/.test(suffix) ? "dim" : "m"; // m7(b5) = meio-diminuto
  if (/^(aug|\+)/.test(suffix)) return "aug";
  return "M";
}

// Só o grau no campo harmônico. A qualidade (M, m, °, +) só aparece quando foge
// do campo: acorde de empréstimo modal ou fora da escala, ex.: Fm em C = 4m, Bb em C = b7M.
// Extensões são ignoradas (Dm7 = 2); o baixo invertido é mantido (G/B = 5/7).
function chordToDegree(chord, settings) {
  const { tonic, degrees, field } = settings;
  const distance = (chord.root - tonic + 12) % 12;
  const quality = chordQuality(chord.suffix);
  const expected = field[distance];
  const mark = quality && quality !== expected ? QUALITY_MARK[quality] : "";
  let result = degrees[distance] + mark;
  if (chord.bass !== null) result += "/" + degrees[(chord.bass - tonic + 12) % 12];
  return result;
}

// ---------- 4. Decidir se uma linha é de acordes ----------
const LABEL_RE = /^\[.*\]$/;      // [Intro], [Refrão]...
const PARENS_ONLY_RE = /^[()]+$/; // "(" ou ")" soltos

// Remove parênteses de agrupamento, ex.: "(Cm9" ou "Eb7)"; mantém os do acorde, ex.: "Fm7(11)"
function splitToken(token) {
  let lead = "";
  let core = token;
  while (core.startsWith("(")) { lead += "("; core = core.slice(1); }
  if (parseChord(core)) return { lead, core, trail: "" };
  let trail = "";
  while (core.endsWith(")")) {
    trail = ")" + trail;
    core = core.slice(0, -1);
    if (parseChord(core)) return { lead, core, trail };
  }
  return null;
}

function convertLine(line, settings) {
  const tokens = [...line.matchAll(/\S+/g)];
  if (tokens.length === 0) return { text: line, isChordLine: false };

  let chordCount = 0;
  const pieces = [];
  for (const t of tokens) {
    const raw = t[0];
    if (LABEL_RE.test(raw) || PARENS_ONLY_RE.test(raw)) {
      pieces.push({ col: t.index, text: raw, isChord: false });
      continue;
    }
    const parts = splitToken(raw);
    if (!parts) return { text: line, isChordLine: false }; // achou palavra: é letra
    chordCount++;
    pieces.push({
      col: t.index,
      lead: parts.lead,
      text: chordToDegree(parseChord(parts.core), settings),
      trail: parts.trail,
      isChord: true,
    });
  }
  if (chordCount === 0) return { text: line, isChordLine: false };

  // Reconstrói a linha mantendo cada grau na mesma coluna do acorde original,
  // para continuar alinhado com a sílaba de baixo.
  let out = "";
  const html = [];
  for (const p of pieces) {
    const gap = Math.max(p.col - out.length, out.length ? 1 : 0);
    out += " ".repeat(gap);
    html.push(" ".repeat(gap));
    const full = (p.lead || "") + p.text + (p.trail || "");
    out += full;
    html.push(p.isChord
      ? escapeHtml(p.lead) + `<span class="ch">${escapeHtml(p.text)}</span>` + escapeHtml(p.trail)
      : escapeHtml(p.text));
  }
  return { text: out, html: html.join(""), isChordLine: true };
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ---------- 5. Interface ----------
const $ = (id) => document.getElementById(id);
const rootSel = $("root"), modeSel = $("mode"), relativeChk = $("relative");
const input = $("input"), output = $("output"), refEl = $("ref"), statusEl = $("status");

ROOT_OPTIONS.forEach((n) => rootSel.add(new Option(n, n)));

const EXAMPLE = `Tom: Am

[Intro] Am  F  C  G

Am             F
Exemplo de uma linha de letra
C              G/B
Os graus ficam sobre as mesmas sílabas
Dm7      E7(9)      Am
Cole aqui a sua cifra`;

function getSettings() {
  const rootName = rootSel.value;
  let tonic = noteToSemitone(rootName[0], rootName.slice(1));
  let degrees = MAJOR_DEGREES;
  let field = MAJOR_FIELD;
  let refName = rootName + " maior";

  if (modeSel.value === "minor") {
    if (relativeChk.checked) {
      tonic = (tonic + 3) % 12; // relativo maior fica 3 semitons acima
      refName = ROOT_OPTIONS[tonic] + " maior (relativo de " + rootName + "m)";
    } else {
      degrees = MINOR_DEGREES;
      field = MINOR_FIELD;
      refName = rootName + " menor";
    }
  }
  return { tonic, degrees, field, refName };
}

let lastText = "";
let lastLines = []; // [{ text, isChordLine }] usado para montar o Word

function render() {
  const settings = getSettings();
  refEl.innerHTML = "Graus contados a partir de <strong>" + escapeHtml(settings.refName) + "</strong>";
  relativeChk.disabled = modeSel.value !== "minor";

  const textLines = [];
  const htmlLines = [];
  lastLines = [];
  let chordLines = 0;
  for (const line of input.value.split("\n")) {
    const r = convertLine(line, settings);
    textLines.push(r.text);
    lastLines.push({ text: r.text, isChordLine: r.isChordLine });
    htmlLines.push(r.isChordLine ? r.html : escapeHtml(r.text));
    if (r.isChordLine) chordLines++;
  }
  lastText = textLines.join("\n");
  output.innerHTML = htmlLines.join("\n");
  statusEl.textContent = input.value.trim()
    ? chordLines + (chordLines === 1 ? " linha de acordes convertida" : " linhas de acordes convertidas")
    : "Cole uma cifra para começar.";
}

// Lê "Tom: Cm" do texto e ajusta os seletores sozinho
function detectKey() {
  const m = input.value.match(/Tom:\s*([A-G])([#b]?)(m?)/i);
  if (!m) return;
  const value = noteToSemitone(m[1].toUpperCase(), m[2]);
  rootSel.value = ROOT_OPTIONS[value];
  modeSel.value = m[3] ? "minor" : "major";
}

input.addEventListener("input", () => { detectKey(); render(); });
[rootSel, modeSel, relativeChk].forEach((el) => el.addEventListener("change", render));

$("clear").addEventListener("click", () => { input.value = ""; render(); input.focus(); });

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(lastText);
    statusEl.textContent = "Copiado.";
  } catch {
    statusEl.textContent = "Não foi possível copiar. Selecione o texto e use Ctrl+C.";
  }
});

// ---------- 6. Exportar para Word ----------
// Fonte monoespaçada (Consolas) para os graus continuarem alinhados com as sílabas.
function buildDocx() {
  const { Document, Packer, Paragraph, TextRun } = window.docx;
  const paragraphs = lastLines.map((line) => new Paragraph({
    spacing: { after: 0, line: 260 },
    children: [new TextRun({
      text: line.text,
      font: "Consolas",
      size: 21, // em meios-pontos: 21 = 10,5pt
      bold: line.isChordLine,
      color: line.isChordLine ? "B04A2F" : "1E2433",
    })],
  }));
  const doc = new Document({
    sections: [{
      properties: { page: { margin: { top: 1000, bottom: 1000, left: 1000, right: 1000 } } },
      children: paragraphs,
    }],
  });
  return Packer.toBlob(doc);
}

// Download padrão do navegador: cria um link temporário apontando para o arquivo
// gerado em memória, clica nele e depois libera essa memória.
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Nome do arquivo: tira caracteres que o Windows não aceita (\ / : * ? " < > |)
// e usa "cifra-em-graus" quando o campo fica vazio.
function safeFileName(name) {
  const clean = name.replace(/[\\/:*?"<>|]+/g, "").replace(/\s+/g, " ").trim().replace(/\.docx$/i, "");
  return (clean || "cifra-em-graus") + ".docx";
}

const nameDialog = $("nameDialog"), fileNameInput = $("fileName"), filePreview = $("filePreview");
let lastFileName = ""; // lembra o nome usado no último download

fileNameInput.addEventListener("input", () => { filePreview.textContent = safeFileName(fileNameInput.value); });
$("nameCancel").addEventListener("click", () => nameDialog.close());

$("word").addEventListener("click", () => {
  if (!input.value.trim()) { statusEl.textContent = "Cole uma cifra antes de baixar."; return; }
  if (!window.docx) { statusEl.textContent = "Não foi possível carregar o gerador de Word. Verifique sua conexão."; return; }
  fileNameInput.value = lastFileName;
  filePreview.textContent = safeFileName(lastFileName);
  nameDialog.showModal();
  fileNameInput.select();
});

$("nameForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const filename = safeFileName(fileNameInput.value);
  lastFileName = fileNameInput.value.trim();
  nameDialog.close();
  try {
    const blob = await buildDocx();
    downloadBlob(blob, filename);
    statusEl.textContent = "Word baixado: " + filename;
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Não foi possível gerar o Word. Use o botão Copiar.";
  }
});

input.value = EXAMPLE;
detectKey();
render();
</script>
</body>
</html>
